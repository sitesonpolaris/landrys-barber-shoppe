[build]
  command = "npm run build"
  publish = ".next"

# Next.js runtime (OpenNext adapter). Netlify keeps it on the latest version.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
